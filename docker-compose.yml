services:
  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      ORIGIN: "http://localhost:4200"
      NODE_ENV: production
      MONGO_URI: "mongodb://root:root@mongo:27017/gym-tracker?authSource=admin"
      # move these to a real .env / secrets before going further than local testing
      CRYTO_HASH_SALT: "change-me"
      CRYPTO_HASH_ITERATION: 1000
      JWT_SECRET: "change-me"
      REFRESH_JWT_SECRET: "change-me"
