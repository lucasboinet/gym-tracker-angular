@if (updateService.updateAvailable$ | async) {
  <div class="flex items-center justify-between gap-2 bg-primary-500 p-3 text-sm text-surface-950">
    <div class="flex items-center gap-2">
      <i class="pi pi-sync" style="font-size: 15px"></i>
      <span class="font-medium">A new version of the app is available.</span>
    </div>
    <div class="flex items-center gap-2">
      <button
        class="cursor-pointer rounded-md bg-surface-950/20 px-2.5 py-1 font-medium hover:bg-surface-950/30"
        (click)="reload()"
      >
        Update
      </button>
      <button
        class="cursor-pointer rounded-md px-2.5 py-1 font-medium hover:bg-surface-950/10"
        (click)="dismiss()"
      >
        Later
      </button>
    </div>
  </div>
}
