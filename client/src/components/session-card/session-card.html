<div
  class="overflow-hidden rounded-2xl border border-surface-800 bg-surface-900 transition-colors hover:border-surface-700"
>
  <div class="p-4">
    <div class="mb-3 flex items-start justify-between">
      <div class="flex items-center gap-3">
        <div
          class="flex h-12 w-12 items-center justify-center rounded-xl"
          [style.background]="session().color"
        >
          <i class="pi pi-bolt" [style.color]="contrastColor()"></i>
        </div>
        <div>
          <h3 class="font-semibold text-surface-50">{{ session().name }}</h3>
          <p class="text-sm text-surface-400">Created {{ durationFromCreatedAt() }}</p>
        </div>
      </div>

      <div class="relative">
        <button
          type="button"
          class="flex h-8 w-8 items-center justify-center rounded-lg text-surface-400 transition-colors hover:bg-surface-800 hover:text-surface-100 cursor-pointer"
          (click)="toggleMenu($event)"
        >
          <i class="pi pi-ellipsis-v"></i>
        </button>

        @if (menuOpen()) {
          <div
            class="absolute right-0 top-full z-30 mt-1 w-36 overflow-hidden rounded-xl border border-surface-700 bg-surface-850 py-1 shadow-2xl"
          >
            <button
              type="button"
              class="flex w-full items-center gap-2.5 px-3.5 py-2 text-sm text-surface-200 transition-colors hover:bg-surface-800 cursor-pointer"
              (click)="editSession()"
            >
              <i class="pi pi-pencil text-xs"></i> Edit
            </button>
            <button
              type="button"
              class="flex w-full items-center gap-2.5 px-3.5 py-2 text-sm text-red-400 transition-colors hover:bg-surface-800 cursor-pointer"
              (click)="onDeleteSession()"
            >
              <i class="pi pi-trash text-xs"></i> Delete
            </button>
          </div>
        }
      </div>
    </div>

    <div class="mb-3 flex items-center gap-4 text-sm text-surface-400">
      <span class="flex items-center gap-1.5">
        <i class="pi pi-list"></i>
        {{ session().exercises.length }} exercises
      </span>
    </div>

    <div class="mb-4 flex flex-wrap gap-2">
      @for (exercise of session().exercises.slice(0, 3); track $index) {
        <span
          class="inline-flex items-center rounded-full bg-surface-800 px-2.5 py-1 text-xs font-medium text-surface-300"
          >{{ exercise.name }}</span
        >
      }
      @if (session().exercises.length > 3) {
        <span
          class="inline-flex items-center rounded-full bg-primary-500/10 px-2.5 py-1 text-xs font-medium text-primary-400"
          >+{{ session().exercises.length - 3 }} more</span
        >
      }
    </div>

    <button
      type="button"
      class="flex w-full items-center justify-center gap-2 rounded-xl bg-primary-500 px-4 py-2.5 font-medium text-surface-950 transition-colors hover:bg-primary-400 cursor-pointer"
      (click)="onStartSession()"
    >
      <i class="pi pi-play"></i>
      Start Session
    </button>
  </div>
</div>

<session-dialog
  [(open)]="showEditDialog"
  (openChange)="showEditDialog = $event"
  [session]="session()"
  title="Edit session"
  buttonLabel="Update"
  action="edit"
></session-dialog>
