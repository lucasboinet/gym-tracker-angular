<div class="overflow-hidden rounded-2xl border border-surface-800 bg-surface-900">
  <!-- Exercise Header -->
  <div class="flex items-center justify-between border-b border-surface-800 bg-surface-850 px-4 py-3">
    <h4 class="font-semibold text-surface-50">{{ exercise().name }}</h4>
    <button
      type="button"
      class="flex h-8 w-8 items-center justify-center rounded-lg text-surface-500 transition-colors hover:bg-red-500/10 hover:text-red-400 cursor-pointer"
      (click)="onRemoveExercise(exercise()._id!)"
    >
      <i class="pi pi-trash text-sm"></i>
    </button>
  </div>

  <!-- Sets -->
  <div class="flex flex-col gap-5 p-4">
    @for (set of exercise().sets; track $index) {
      <set-input
        [set]="set"
        [exercise]="exercise()"
        [workoutId]="workoutId()"
        [index]="$index"
        [fatigued]="fatigued()"
        (removeSet)="onRemoveSet($event.id, $event.index)"
        (updateSet)="onUpdateSet($event.id, $event.index, $event.type, $event.value)"
      />
    }
  </div>

  <!-- Add Set Button -->
  <div class="px-4">
    <ui-button
      label="Add Set"
      icon="pi pi-plus"
      variant="outline"
      size="sm"
      [full]="true"
      (onClick)="onAddSet(exercise()._id!)"
    />
  </div>

  <!-- Exercise notes -->
  <div class="mt-1 flex flex-col gap-2 p-4">
    <label for="exercise_notes" class="text-xs font-medium text-surface-400">Notes</label>
    <textarea
      [value]="exercise().notes ?? ''"
      id="exercise_notes"
      rows="4"
      class="field resize-none"
      [placeholder]="
        previousMatchingExercise()?.notes
          ? 'Notes from previous exercise : ' + previousMatchingExercise()?.notes
          : 'No notes from previous exercise'
      "
      (input)="onUpdateExerciseNotes($event)"
    ></textarea>
  </div>
</div>
