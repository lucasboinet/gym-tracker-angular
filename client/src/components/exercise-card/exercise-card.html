<div class="overflow-hidden rounded-2xl border border-surface-800 bg-surface-900">
  <!-- Exercise Header -->
  <div class="flex items-center justify-between border-b border-surface-800 bg-surface-850 px-4 py-3">
    <div class="flex min-w-0 items-center gap-2">
      @if (showHandle()) {
        <button
          cdkDragHandle
          type="button"
          class="flex h-7 w-6 cursor-grab items-center justify-center text-surface-600 transition-colors hover:text-surface-300 active:cursor-grabbing"
          aria-label="Reorder exercise"
        >
          <i class="pi pi-bars text-sm"></i>
        </button>
      }
      @if (inSuperset()) {
        <span
          class="flex h-5 w-5 shrink-0 items-center justify-center rounded-md bg-primary-500/15 text-[11px] font-bold text-primary-400"
          >{{ memberLabel() }}</span
        >
      }
      <h4 class="truncate font-semibold text-surface-50">{{ exercise().name }}</h4>
    </div>
    <div class="flex shrink-0 items-center gap-1">
      @if (inSuperset()) {
        <button
          type="button"
          title="Remove from superset"
          class="flex h-8 w-8 items-center justify-center rounded-lg text-surface-500 transition-colors hover:bg-surface-800 hover:text-surface-200 cursor-pointer"
          (click)="onRemoveFromSuperset()"
        >
          <i class="pi pi-arrow-up-left text-sm"></i>
        </button>
      } @else {
        <button
          type="button"
          title="Make superset"
          class="flex h-8 w-8 items-center justify-center rounded-lg text-surface-500 transition-colors hover:bg-surface-800 hover:text-primary-400 cursor-pointer"
          (click)="onConvertToSuperset()"
        >
          <i class="pi pi-clone text-sm"></i>
        </button>
      }
      <button
        type="button"
        class="flex h-8 w-8 items-center justify-center rounded-lg text-surface-500 transition-colors hover:bg-red-500/10 hover:text-red-400 cursor-pointer"
        (click)="onRemoveExercise(exercise()._id!)"
      >
        <i class="pi pi-trash text-sm"></i>
      </button>
    </div>
  </div>

  <!-- Sets -->
  <div class="flex flex-col gap-5 p-4">
    @for (set of exercise().sets; track $index) {
      <set-input
        [set]="set"
        [exercise]="exercise()"
        [workoutId]="workoutId()"
        [index]="$index"
        [fatigued]="fatigued()"
        [showRest]="showRest()"
        (removeSet)="onRemoveSet($event.id, $event.index)"
        (updateSet)="onUpdateSet($event.id, $event.index, $event.type, $event.value)"
      />
    }
  </div>

  <!-- Add Set Button -->
  <div class="px-4">
    <ui-button
      label="Add Set"
      icon="pi pi-plus"
      variant="outline"
      size="sm"
      [full]="true"
      (onClick)="onAddSet(exercise()._id!)"
    />
  </div>

  <!-- Exercise notes -->
  <div class="mt-1 flex flex-col gap-2 p-4">
    <label for="exercise_notes" class="text-xs font-medium text-surface-400">Notes</label>
    <textarea
      [value]="exercise().notes ?? ''"
      id="exercise_notes"
      rows="4"
      class="field resize-none"
      [placeholder]="
        previousMatchingExercise()?.notes
          ? 'Notes from previous exercise : ' + previousMatchingExercise()?.notes
          : 'No notes from previous exercise'
      "
      (input)="onUpdateExerciseNotes($event)"
    ></textarea>
  </div>
</div>
