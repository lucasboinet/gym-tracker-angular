<ui-dialog
  header="Add Exercise"
  [visible]="open"
  (visibleChange)="OnOpenChange($event)"
  [closable]="true"
  maxWidth="26rem"
>
  <div class="space-y-5">
    <div>
      <label for="exercise-name" class="mb-2 block text-sm font-medium text-surface-300"
        >Exercise Name</label
      >
      <input
        id="exercise-name"
        type="text"
        [ngModel]="query()"
        (ngModelChange)="query.set($event)"
        (keydown.enter)="onExerciseAdded(query())"
        placeholder="Enter exercise name"
        class="field"
      />

      @if (suggestions().length) {
        <div class="mt-2 overflow-hidden rounded-xl border border-surface-800 bg-surface-850">
          @for (name of suggestions(); track name) {
            <button
              type="button"
              class="flex w-full items-center gap-2.5 px-3.5 py-2 text-left text-sm text-surface-200 transition-colors hover:bg-surface-800 cursor-pointer"
              (click)="onExerciseAdded(name)"
            >
              <i class="pi pi-history text-xs text-surface-500"></i>
              {{ name }}
            </button>
          }
        </div>
      }
    </div>

    <div>
      <h4 class="mb-3 text-sm font-medium text-surface-300">Quick Add</h4>
      <div class="grid grid-cols-2 gap-2">
        @for (exercise of commonExercises; track exercise) {
          <ui-button
            [label]="exercise"
            variant="secondary"
            size="sm"
            (onClick)="onExerciseAdded(exercise)"
          />
        }
      </div>
    </div>
  </div>

  <div dialogFooter class="flex gap-2 border-t border-surface-800 p-4">
    <ui-button variant="ghost" label="Cancel" [full]="true" (onClick)="onAddExerciseCancel()" />
    <ui-button
      label="Add Custom"
      icon="pi pi-check"
      [full]="true"
      [disabled]="!query().trim()"
      (onClick)="onExerciseAdded(query())"
    />
  </div>
</ui-dialog>
