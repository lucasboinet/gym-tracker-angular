<ui-dialog
  header="Add Exercise"
  [visible]="open"
  (visibleChange)="OnOpenChange($event)"
  [closable]="true"
  maxWidth="26rem"
>
  <div class="space-y-5">
    <div>
      <label for="exercise-name" class="mb-2 block text-sm font-medium text-surface-300"
        >Exercise Name</label
      >
      <input
        id="exercise-name"
        type="text"
        [(ngModel)]="newExerciseName"
        placeholder="Enter exercise name"
        class="field"
      />
    </div>

    <div>
      <h4 class="mb-3 text-sm font-medium text-surface-300">Quick Add</h4>
      <div class="grid grid-cols-2 gap-2">
        @for (exercise of commonExercises; track exercise) {
          <ui-button
            [label]="exercise"
            variant="secondary"
            size="sm"
            (onClick)="onExerciseAdded(exercise)"
          />
        }
      </div>
    </div>
  </div>

  <div dialogFooter class="flex gap-2 border-t border-surface-800 p-4">
    <ui-button variant="ghost" label="Cancel" [full]="true" (onClick)="onAddExerciseCancel()" />
    <ui-button
      label="Add Custom"
      icon="pi pi-check"
      [full]="true"
      [disabled]="!newExerciseName.trim()"
      (onClick)="onExerciseAdded(newExerciseName)"
    />
  </div>
</ui-dialog>
