@if (timer.active()) {
  <div class="fixed bottom-20 left-0 right-0 px-4 z-50 pointer-events-none">
    <div
      class="pointer-events-auto max-w-md mx-auto bg-white rounded-xl shadow-lg border overflow-hidden"
      [class.ring-2]="done()"
      [class.ring-green-400]="done()"
    >
      <!-- Progress bar -->
      <div class="h-1.5 bg-gray-100">
        <div
          class="h-full transition-all duration-300 ease-linear"
          [class.bg-blue-500]="!done()"
          [class.bg-green-500]="done()"
          [style.width.%]="progress()"
        ></div>
      </div>

      <div class="flex items-center justify-between gap-3 px-4 py-3">
        <div class="flex flex-col">
          <span class="text-xs font-medium text-gray-500">
            {{ done() ? 'Rest done' : 'Resting' }}{{ timer.label() ? ' · ' + timer.label() : '' }}
          </span>
          <span
            class="text-2xl font-bold tabular-nums"
            [class.text-gray-900]="!done()"
            [class.text-green-600]="done()"
          >
            {{ done() ? "Go! 💪" : formatted() }}
          </span>
        </div>

        <div class="flex items-center gap-1">
          @if (!done()) {
            <p-button
              icon="pi pi-plus"
              label="15s"
              (onClick)="timer.addTime(15)"
              styleClass="p-button-text p-button-sm"
              [text]="true"
            />
            <p-button
              [icon]="timer.running() ? 'pi pi-pause' : 'pi pi-play'"
              (onClick)="timer.toggle()"
              styleClass="p-button-text p-button-rounded"
              [text]="true"
            />
          }
          <p-button
            [icon]="done() ? 'pi pi-check' : 'pi pi-times'"
            (onClick)="timer.dismiss()"
            styleClass="p-button-text p-button-rounded"
            [text]="true"
          />
        </div>
      </div>
    </div>
  </div>
}
