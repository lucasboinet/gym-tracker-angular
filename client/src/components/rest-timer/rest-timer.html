@if (timer.active()) {
  <div class="pointer-events-none fixed inset-x-0 bottom-24 z-50 px-4">
    <div
      class="pointer-events-auto mx-auto max-w-md overflow-hidden rounded-2xl border border-surface-700 bg-surface-850 shadow-2xl"
      [class.ring-2]="done()"
      [class.ring-primary-400]="done()"
    >
      <!-- Progress bar -->
      <div class="h-1.5 bg-surface-800">
        <div
          class="h-full transition-all duration-300 ease-linear"
          [class.bg-primary-500]="!done()"
          [class.bg-primary-400]="done()"
          [style.width.%]="progress()"
        ></div>
      </div>

      <div class="flex items-center justify-between gap-3 px-4 py-3">
        <div class="flex flex-col">
          <span class="text-xs font-medium text-surface-400">
            {{ done() ? 'Rest done' : 'Resting' }}{{ timer.label() ? ' · ' + timer.label() : '' }}
          </span>
          <span
            class="text-2xl font-bold tabular-nums"
            [class.text-surface-50]="!done()"
            [class.text-primary-400]="done()"
          >
            {{ done() ? 'Go! 💪' : formatted() }}
          </span>
        </div>

        <div class="flex items-center gap-1">
          @if (!done()) {
            <button
              type="button"
              class="rounded-lg px-3 py-1.5 text-sm font-medium text-surface-300 transition-colors hover:bg-surface-800 hover:text-primary-400 cursor-pointer"
              (click)="timer.addTime(15)"
            >
              +15s
            </button>
            <button
              type="button"
              class="flex h-9 w-9 items-center justify-center rounded-lg text-surface-300 transition-colors hover:bg-surface-800 hover:text-primary-400 cursor-pointer"
              (click)="timer.toggle()"
            >
              <i [class]="timer.running() ? 'pi pi-pause' : 'pi pi-play'"></i>
            </button>
          }
          <button
            type="button"
            class="flex h-9 w-9 items-center justify-center rounded-lg text-surface-300 transition-colors hover:bg-surface-800 hover:text-surface-100 cursor-pointer"
            (click)="timer.dismiss()"
          >
            <i [class]="done() ? 'pi pi-check' : 'pi pi-times'"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
}
