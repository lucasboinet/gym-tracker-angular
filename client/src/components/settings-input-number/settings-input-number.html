<div>
  <div class="mb-2 flex items-center gap-2">
    <label [for]="model().slug" class="block text-sm font-medium text-surface-300">{{
      label()
    }}</label>

    @if (loading()) {
      <i class="pi pi-spinner-dotted pi-spin text-primary-400" style="font-size: 0.7rem"></i>
    }

    @if (saved()) {
      <i class="pi pi-check text-primary-400" style="font-size: 0.7rem"></i>
    }
  </div>

  <div class="relative">
    <input
      type="number"
      step="1"
      [name]="model().slug"
      placeholder="Enter a value"
      [ngModel]="model().value"
      (ngModelChange)="handleModelChange($event)"
      class="field pr-16"
    />
    <div class="absolute right-3 top-1/2 -translate-y-1/2">
      <select
        [ngModel]="unit().value"
        (ngModelChange)="handleUnitChange($event)"
        [name]="unit().slug"
        class="cursor-pointer border-none bg-transparent text-sm font-medium text-surface-300 outline-none"
      >
        @for (unit of units(); track $index) {
          <option [value]="unit" class="bg-surface-850 text-surface-100">{{ unit }}</option>
        }
      </select>
    </div>
  </div>
</div>
