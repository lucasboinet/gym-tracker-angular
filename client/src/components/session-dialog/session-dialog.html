<ui-dialog
  [header]="title"
  [visible]="open"
  (visibleChange)="onOpenChange($event)"
  (show)="handleOnShow()"
  maxWidth="34rem"
  panelClass="h-[85vh]"
  contentClass="!overflow-hidden !flex !flex-col !gap-4"
>
  <!-- Name + color -->
  <div class="flex items-end gap-3">
    <div>
      <label class="mb-2 block text-sm font-medium text-surface-300">Color</label>
      <input
        type="color"
        [(ngModel)]="color"
        class="h-11 w-14 cursor-pointer rounded-lg border border-surface-700 bg-surface-900 p-1"
      />
    </div>

    <div class="flex-1">
      <label for="session-name" class="mb-2 block text-sm font-medium text-surface-300"
        >Session Name</label
      >
      <input
        id="session-name"
        type="text"
        [(ngModel)]="name"
        class="field"
        placeholder="e.g., Upper Body Power"
      />
    </div>
  </div>

  <!-- Exercises -->
  <div
    cdkDropList
    (cdkDropListDropped)="reorderExercises($event)"
    class="-mr-2 flex-1 space-y-3 overflow-y-auto pr-2"
  >
    @for (exercise of exercises; track $index) {
      <div
        cdkDrag
        [cdkDragDisabled]="exercises.length < 2"
        class="flex flex-col gap-3 rounded-xl border border-surface-800 bg-surface-850 p-4"
      >
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <button
              cdkDragHandle
              type="button"
              class="flex h-6 w-5 cursor-grab items-center justify-center text-surface-600 transition-colors hover:text-surface-300 active:cursor-grabbing"
              aria-label="Reorder exercise"
            >
              <i class="pi pi-bars text-xs"></i>
            </button>
            <span class="text-surface-100">{{ exercise.name }}</span>
          </div>

          <button
            type="button"
            class="text-surface-500 hover:text-red-400 cursor-pointer transition-colors"
            (click)="removeExercise($index)"
          >
            <i class="pi pi-trash text-xs"></i>
          </button>
        </div>

        <div class="flex items-center justify-between gap-2">
          <label class="flex items-center gap-2 text-xs font-medium text-surface-400">
            <i class="pi pi-clock text-xs"></i>
            Rest between sets
          </label>
          <ui-number
            [value]="exercise.restTime ?? 0"
            (valueChange)="updateRestTime($index, $event ?? 0)"
            [min]="0"
            [max]="600"
            [step]="15"
            suffix=" s"
            styleClass="w-32"
          />
        </div>
      </div>
    } @empty {
      <p class="py-8 text-center text-sm text-surface-500">
        No exercises yet. Add one to build this session.
      </p>
    }
  </div>

  <div dialogFooter class="flex flex-col gap-3 border-t border-surface-800 p-4">
    <ui-button
      label="Add Exercise"
      icon="pi pi-plus"
      variant="outline"
      [full]="true"
      (onClick)="showAddExercise = true"
    />
    <div class="flex gap-3">
      <ui-button variant="ghost" label="Cancel" [full]="true" (onClick)="cancelSessionCreation()" />
      <ui-button [label]="buttonLabel" [full]="true" (onClick)="handleExecuteAction()" />
    </div>
  </div>
</ui-dialog>

<add-exercise-dialog
  [(open)]="showAddExercise"
  (openChange)="showAddExercise = $event"
  (exerciseAdded)="onExerciseAdded($event)"
></add-exercise-dialog>
