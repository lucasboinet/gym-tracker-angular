<!-- Top bar -->
<div class="sticky top-0 z-50 border-b border-surface-800 bg-surface-950/80 backdrop-blur-lg">
  <div class="mx-auto flex max-w-4xl items-center justify-between px-4 py-3">
    <div routerLink="/" class="flex cursor-pointer items-center gap-2.5">
      <div
        class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary-500 shadow-sm shadow-primary-500/30"
      >
        <i class="pi pi-bolt text-sm text-surface-950"></i>
      </div>
      <h1 class="text-base font-bold tracking-tight text-surface-50">Gym Tracker</h1>
    </div>

    <!-- Desktop nav -->
    <nav class="hidden items-center gap-1 sm:flex">
      <a
        routerLink="/"
        routerLinkActive="!bg-surface-800 !text-primary-400"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex h-9 w-9 items-center justify-center rounded-lg text-surface-400 transition-colors hover:bg-surface-800 hover:text-surface-100"
        aria-label="Workout"
      >
        <i class="pi pi-play"></i>
      </a>
      <a
        routerLink="/stats"
        routerLinkActive="!bg-surface-800 !text-primary-400"
        class="flex h-9 w-9 items-center justify-center rounded-lg text-surface-400 transition-colors hover:bg-surface-800 hover:text-surface-100"
        aria-label="Stats"
      >
        <i class="pi pi-chart-bar"></i>
      </a>
      <a
        routerLink="/sessions"
        routerLinkActive="!bg-surface-800 !text-primary-400"
        class="flex h-9 w-9 items-center justify-center rounded-lg text-surface-400 transition-colors hover:bg-surface-800 hover:text-surface-100"
        aria-label="Sessions"
      >
        <i class="pi pi-file"></i>
      </a>
      <a
        routerLink="/history"
        routerLinkActive="!bg-surface-800 !text-primary-400"
        class="flex h-9 w-9 items-center justify-center rounded-lg text-surface-400 transition-colors hover:bg-surface-800 hover:text-surface-100"
        aria-label="History"
      >
        <i class="pi pi-history"></i>
      </a>

      <span class="mx-1 h-5 w-px bg-surface-800"></span>

      <a
        routerLink="/settings"
        routerLinkActive="!bg-surface-800 !text-primary-400"
        class="flex h-9 w-9 items-center justify-center rounded-lg text-surface-400 transition-colors hover:bg-surface-800 hover:text-surface-100"
        aria-label="Settings"
      >
        <i class="pi pi-cog"></i>
      </a>
    </nav>
  </div>
</div>

<!-- Mobile bottom nav -->
<nav
  class="fixed inset-x-0 bottom-0 z-50 grid grid-cols-5 border-t border-surface-800 bg-surface-950/90 backdrop-blur-lg sm:hidden"
>
  <a
    routerLink="/"
    routerLinkActive="!text-primary-400"
    [routerLinkActiveOptions]="{ exact: true }"
    class="flex flex-col items-center gap-0.5 py-2.5 text-surface-400 transition-colors"
  >
    <i class="pi pi-play text-base"></i>
    <span class="text-[10px] font-medium">Workout</span>
  </a>
  <a
    routerLink="/stats"
    routerLinkActive="!text-primary-400"
    class="flex flex-col items-center gap-0.5 py-2.5 text-surface-400 transition-colors"
  >
    <i class="pi pi-chart-bar text-base"></i>
    <span class="text-[10px] font-medium">Stats</span>
  </a>
  <a
    routerLink="/sessions"
    routerLinkActive="!text-primary-400"
    class="flex flex-col items-center gap-0.5 py-2.5 text-surface-400 transition-colors"
  >
    <i class="pi pi-file text-base"></i>
    <span class="text-[10px] font-medium">Sessions</span>
  </a>
  <a
    routerLink="/history"
    routerLinkActive="!text-primary-400"
    class="flex flex-col items-center gap-0.5 py-2.5 text-surface-400 transition-colors"
  >
    <i class="pi pi-history text-base"></i>
    <span class="text-[10px] font-medium">History</span>
  </a>
  <a
    routerLink="/settings"
    routerLinkActive="!text-primary-400"
    class="flex flex-col items-center gap-0.5 py-2.5 text-surface-400 transition-colors"
  >
    <i class="pi pi-cog text-base"></i>
    <span class="text-[10px] font-medium">Settings</span>
  </a>
</nav>
