<div class="py-20 text-center">
  <div class="mb-8">
    <div
      class="mx-auto mb-5 flex h-24 w-24 items-center justify-center rounded-full bg-primary-500/10 ring-1 ring-primary-500/20"
    >
      <i class="pi pi-play text-2xl text-primary-400"></i>
    </div>
    <h2 class="mb-2 text-2xl font-bold text-surface-50">Ready to train?</h2>
    <p class="text-surface-400">Start your workout and track your progress</p>
  </div>

  <div class="mx-auto max-w-xs">
    <ui-button
      label="Start Workout"
      icon="pi pi-play"
      size="lg"
      [full]="true"
      (onClick)="onStartWorkout()"
    />
  </div>
</div>
