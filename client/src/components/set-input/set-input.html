<div class="flex flex-col gap-2">
  <div class="flex items-end justify-between gap-3">
    <div
      class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-primary-500/10 mb-1.5"
    >
      <span class="text-sm font-semibold text-primary-400">{{ index() + 1 }}</span>
    </div>

    <div class="flex min-w-0 flex-1 flex-col">
      <label
        for="{{ exercise()._id }}-weigth-{{ index() }}"
        class="mb-1 block text-xs font-medium text-surface-400"
        >Weight (kg)</label
      >
      <ui-number
        [value]="set().weight"
        (valueChange)="onUpdateSet(exercise()._id!, index(), 'weight', $event ?? 0)"
        [min]="0"
        [step]="1"
        [maxFractionDigits]="2"
      />
      @if (previousMatchingSet()) {
        <span class="mt-1 text-xs text-surface-500">Prev: {{ previousMatchingSet()?.weight }}kg</span>
      }
    </div>

    <div class="flex min-w-0 flex-1 flex-col">
      <label
        for="{{ exercise()._id }}-reps-{{ index() }}"
        class="mb-1 block text-xs font-medium text-surface-400"
        >Reps</label
      >
      <ui-number
        [value]="set().reps"
        (valueChange)="onUpdateSet(exercise()._id!, index(), 'reps', $event ?? 0)"
        [min]="0"
        [step]="1"
      />
      @if (previousMatchingSet()) {
        <span class="mt-1 text-xs text-surface-500">Prev: {{ previousMatchingSet()?.reps }} reps</span>
      }
    </div>

    <button
      type="button"
      class="mb-1 flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-surface-500 transition-colors hover:bg-red-500/10 hover:text-red-400 cursor-pointer"
      (click)="onRemoveSet(exercise()._id!, index())"
    >
      <i class="pi pi-minus text-sm"></i>
    </button>
  </div>

  <div class="ml-11 flex flex-wrap items-center gap-2">
    @if (exercise().restTime && showRest()) {
      <button
        type="button"
        (click)="startRest()"
        class="flex cursor-pointer items-center gap-2 rounded-full bg-surface-800 px-3 py-1.5 text-xs font-medium text-surface-300 transition-colors hover:bg-surface-700 hover:text-primary-400"
      >
        <i class="pi pi-clock text-xs"></i>
        Start rest {{ exercise().restTime }}s
      </button>
    }

    @if (suggestion(); as sug) {
      <button
        type="button"
        (click)="applySuggestion()"
        [title]="sug.reason"
        class="flex cursor-pointer items-center gap-2 rounded-full px-3 py-1.5 text-xs font-medium transition-colors"
        [class.text-primary-400]="sug.kind === 'increase'"
        [class.bg-primary-500/10]="sug.kind === 'increase'"
        [class.hover:bg-primary-500/20]="sug.kind === 'increase'"
        [class.text-amber-400]="sug.kind === 'hold'"
        [class.bg-amber-500/10]="sug.kind === 'hold'"
        [class.hover:bg-amber-500/20]="sug.kind === 'hold'"
      >
        <i
          class="pi text-xs"
          [class.pi-arrow-up-right]="sug.kind === 'increase'"
          [class.pi-minus]="sug.kind === 'hold'"
        ></i>
        {{ sug.kind === 'hold' ? 'Hold' : 'Suggest' }} {{ sug.weight }}kg × {{ sug.reps }}
      </button>
    }
  </div>
</div>
