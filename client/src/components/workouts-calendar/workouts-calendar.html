<div class="mx-auto w-full max-w-4xl p-4">
  <!-- Header with Navigation -->
  <div class="mb-6 flex items-center justify-between">
    <button
      (click)="prevMonth()"
      class="flex h-10 w-10 items-center justify-center rounded-lg text-surface-300 transition-colors hover:bg-surface-800 cursor-pointer"
      aria-label="Previous month"
    >
      <i class="pi pi-chevron-left"></i>
    </button>

    <div class="flex items-center gap-3">
      <h2 class="text-xl font-semibold text-surface-50">
        {{ currentMonthYear }}
      </h2>
      <button
        (click)="goToToday()"
        class="rounded-lg px-3 py-1 text-sm text-primary-400 transition-colors hover:bg-primary-500/10 cursor-pointer"
      >
        Today
      </button>
    </div>

    <button
      (click)="nextMonth()"
      [disabled]="!canGoNextMonth()"
      class="flex h-10 w-10 items-center justify-center rounded-lg text-surface-300 transition-colors hover:bg-surface-800 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer"
      aria-label="Next month"
    >
      <i class="pi pi-chevron-right"></i>
    </button>
  </div>

  <!-- Weekday Labels -->
  <div class="mb-2 grid grid-cols-7 gap-1">
    <div
      *ngFor="let day of weekdayLabels"
      class="py-2 text-center text-sm font-medium text-surface-500"
    >
      {{ day }}
    </div>
  </div>

  <!-- Calendar Grid -->
  <div class="grid grid-cols-7 gap-1">
    @for (week of weeks; track $index) {
      <ng-container>
        @for (date of week; track $index) {
          <div
            [class.opacity-0]="!date"
            [class.pointer-events-none]="!date"
            class="relative min-h-24 cursor-pointer rounded-xl border p-2 transition-all hover:border-surface-600"
            [class.border-primary-500]="isDateToday(date)"
            [class.bg-primary-500/5]="isDateToday(date)"
            [class.border-surface-800]="!isDateToday(date)"
            [class.bg-surface-900]="!isDateToday(date)"
            (click)="onDayClick(date)"
            [attr.aria-label]="date ? date.toDateString() : ''"
          >
            @if (date) {
              <div
                class="mb-1 text-sm font-medium"
                [class.text-primary-400]="isDateToday(date)"
                [class.text-surface-300]="!isDateToday(date)"
              >
                {{ date.getDate() }}
              </div>
            }

            @if (date) {
              <div class="mt-auto flex flex-wrap gap-1">
                @for (event of getEventsForDate(date); track event._id) {
                  <div
                    class="h-2 w-2 rounded-full"
                    [style.background-color]="getColorForEvent(event)"
                  ></div>
                }
              </div>
            }
          </div>
        }
      </ng-container>
    }
  </div>
</div>
