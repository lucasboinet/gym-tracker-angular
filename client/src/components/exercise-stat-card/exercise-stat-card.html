<a
  [routerLink]="['/exercise', stat().exerciseName]"
  class="group flex flex-col gap-3 rounded-2xl border border-surface-800 bg-surface-900 p-4 transition-colors hover:border-surface-700 cursor-pointer"
>
  <div class="flex items-start justify-between gap-2">
    <div class="min-w-0">
      <h3 class="truncate font-semibold text-surface-50 group-hover:text-primary-400">
        {{ stat().exerciseName }}
      </h3>
      <p class="mt-0.5 text-xs text-surface-500">{{ sessionsCount() }} sessions</p>
    </div>
    <i class="pi pi-arrow-up-right text-xs text-surface-600 group-hover:text-primary-400"></i>
  </div>

  <div class="h-12 w-full">
    <ui-chart type="line" [data]="sparkData()" [options]="sparkOptions" />
  </div>

  <div class="flex items-end justify-between">
    <div>
      <div class="text-[11px] uppercase tracking-wide text-surface-500">Best</div>
      <div class="text-lg font-bold text-surface-50">
        {{ best() }} <span class="text-xs font-medium text-surface-500">{{ unit() }}</span>
      </div>
    </div>
    <div class="text-right">
      <div class="text-[11px] uppercase tracking-wide text-surface-500">e1RM</div>
      <div class="text-lg font-bold text-primary-400">
        {{ bestE1rm() }} <span class="text-xs font-medium text-surface-500">{{ unit() }}</span>
      </div>
    </div>
  </div>
</a>
