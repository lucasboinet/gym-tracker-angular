<div class="rounded-2xl border border-surface-800 bg-surface-900 p-4">
  <div class="mb-2 flex items-center justify-between">
    <h3 class="text-sm font-medium text-surface-200">Bodyweight trend</h3>
    <span class="text-xs text-surface-500">{{ unit() }}</span>
  </div>
  @if (entries().length >= 2) {
    <div class="h-64">
      <ui-chart type="line" [data]="data" [options]="options" />
    </div>
  } @else {
    <p class="py-8 text-center text-xs text-surface-500">
      Log at least two bodyweight entries to see your trend.
    </p>
  }
</div>
