<div class="bg-white border shadow rounded-lg p-4">
  <div class="flex items-center justify-between mb-2">
    <h3 class="text-sm font-medium text-gray-700">Bodyweight trend</h3>
    <span class="text-xs text-gray-400">{{ unit() }}</span>
  </div>
  @if (entries().length >= 2) {
    <div class="h-64">
      <p-chart type="line" [data]="data" [options]="options" height="100%" />
    </div>
  } @else {
    <p class="text-xs text-gray-400 text-center py-8">
      Log at least two bodyweight entries to see your trend.
    </p>
  }
</div>
