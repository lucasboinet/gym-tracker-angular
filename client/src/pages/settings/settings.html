<div class="mx-auto max-w-2xl px-4 py-4">
  <div class="mb-6 flex items-center justify-between">
    <h2 class="text-lg font-semibold text-surface-50">Settings</h2>
  </div>

  <form class="flex flex-col gap-6">
    <!-- Weight Input -->
    <settings-input-number
      [model]="getSetting(SETTINGS_SLUG.WEIGHT)"
      [unit]="getSetting(SETTINGS_SLUG.WEIGHT_UNIT)"
      [units]="['kg', 'lbs']"
      [label]="SETTINGS_INPUT_LABELS[SETTINGS_SLUG.WEIGHT]"
    />

    <!-- Height Input -->
    <settings-input-number
      [model]="getSetting(SETTINGS_SLUG.HEIGHT)"
      [unit]="getSetting(SETTINGS_SLUG.HEIGHT_UNIT)"
      [units]="['cm', 'ft']"
      [label]="SETTINGS_INPUT_LABELS[SETTINGS_SLUG.HEIGHT]"
    />

    <!-- Bodyweight tracking -->
    <bodyweight-log />

    <!-- Info Card -->
    <div class="flex items-start gap-3 rounded-2xl border border-primary-500/20 bg-primary-500/5 p-4">
      <i class="pi pi-info-circle mt-0.5 shrink-0 text-primary-400"></i>
      <p class="text-sm text-surface-300">
        Your measurements help us provide accurate workout recommendations and track your progress.
      </p>
    </div>

    <!-- BMI Display -->
    <div class="rounded-2xl border border-surface-800 bg-surface-900 p-5">
      <div class="mb-3 flex items-start justify-between">
        <h3 class="text-sm font-medium text-surface-300">Your BMI</h3>
        <div class="text-right">
          <div class="text-2xl font-bold text-surface-50">{{ bmiData()?.value }}</div>
          <div class="mt-1 text-xs font-medium text-surface-400">{{ bmiData()?.category }}</div>
        </div>
      </div>

      <div #bmiScale class="relative mt-4">
        <div class="flex h-3 overflow-hidden rounded-full">
          <span class="w-full bg-primary-500"></span>
          <span class="w-full bg-yellow-400"></span>
          <span class="w-full bg-orange-400"></span>
          <span class="w-full bg-red-500"></span>
        </div>

        <div
          class="absolute top-0 transition-all duration-300"
          [style.left.px]="scaleIndicatorPosition || 0"
          style="transform: translateX(-50%)"
        >
          <div class="h-3 w-0.5 bg-surface-50"></div>
          <div
            class="-ml-1.5 -mt-0.5 h-4 w-4 rounded-full border-2 border-surface-50 bg-surface-900 shadow-lg"
          ></div>
        </div>
      </div>

      <div class="mt-2 flex justify-between text-xs text-surface-500">
        <div class="flex w-full justify-end">
          <span class="translate-x-1/2">18.5</span>
        </div>
        <div class="flex w-full justify-end">
          <span class="translate-x-1/2">25</span>
        </div>
        <div class="flex w-full justify-end">
          <span class="translate-x-1/2">30</span>
        </div>
        <div class="flex w-full justify-end">
          <span class="translate-x-1/2"></span>
        </div>
      </div>
    </div>
  </form>
</div>
