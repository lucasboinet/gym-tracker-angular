<div class="mx-auto max-w-2xl px-4 pb-24">
  <!-- Start Screen -->
  @if (!this.gymService.currentWorkout()) {
    <no-active-workout (startWorkout)="startWorkout()"></no-active-workout>
  }

  <!-- Active Workout -->
  @if (this.gymService.currentWorkout()) {
    <div class="flex flex-col gap-4 py-4">
      <!-- Workout Info Card -->
      <div class="rounded-2xl border border-surface-800 bg-surface-900 p-4">
        <div class="mb-1.5 flex items-center justify-between">
          <h3 class="font-semibold text-surface-50">Today's Workout</h3>
          <span
            class="inline-flex items-center rounded-full bg-primary-500/10 px-2.5 py-1 text-xs font-medium text-primary-400"
          >
            <span class="mr-1.5 h-2 w-2 animate-pulse rounded-full bg-primary-400"></span>
            Active
          </span>
        </div>
        <p class="text-sm text-surface-400">
          Started at {{ this.gymService.currentWorkout()!.startTime }}
        </p>
      </div>

      <!-- Exercises -->
      @for (exercise of this.gymService.exercises(); track exercise._id) {
        <exercise-card
          [exercise]="exercise"
          [workoutId]="this.gymService.currentWorkout()?._id"
          (addSet)="addSet($event)"
          (removeExercise)="removeExercise($event)"
          (removeSet)="removeSet($event.id, $event.index)"
          (updateSet)="updateSet($event.id, $event.index, $event.type, $event.value)"
          (updateExercise)="updateExercise($event)"
        />
      }

      <!-- Add Exercise Button -->
      <ui-button
        label="Add Exercise"
        icon="pi pi-plus"
        variant="outline"
        size="lg"
        [full]="true"
        (onClick)="showAddExercise = true"
      />
    </div>

    <!-- Fixed Bottom Actions -->
    <div
      class="fixed inset-x-0 bottom-0 z-40 border-t border-surface-800 bg-surface-950/90 p-4 backdrop-blur-lg"
    >
      <div class="mx-auto flex max-w-2xl justify-between gap-3">
        <ui-button
          label="Cancel"
          icon="pi pi-times"
          variant="danger"
          (onClick)="confirmCancelWorkout()"
        />
        <ui-button label="Finish" icon="pi pi-check" variant="primary" (onClick)="finishWorkout()" />
      </div>
    </div>
  }
</div>

<add-exercise-dialog
  [(open)]="showAddExercise"
  (exerciseAdded)="addExercise($event)"
></add-exercise-dialog>

<rest-timer />

@if (completedWorkout()) {
  <complete-workout-dialog
    [(open)]="showCompleteWorkout"
    (openChange)="handleCompleteWorkoutClose($event)"
    [insights]="completedWorkoutInsights()!"
    [workout]="completedWorkout()!"
  />
}
