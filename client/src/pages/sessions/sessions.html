<div class="mx-auto max-w-2xl px-4 pb-20">
  <div class="py-4">
    <div class="mb-4 flex items-center justify-between">
      <h2 class="text-lg font-semibold text-surface-50">My Sessions</h2>
      @if (this.sessionService.sessions().length > 0) {
        <ui-button
          label="Create"
          icon="pi pi-plus"
          size="sm"
          (onClick)="openCreateDialog = true"
        />
      }
    </div>

    <div class="flex flex-col gap-4">
      @for (session of this.sessionService.sessions(); track session._id) {
        <session-card [session]="session"></session-card>
      }
    </div>

    <!-- Empty State -->
    @if (this.sessionService.sessions().length === 0) {
      <div class="py-16 text-center">
        <div
          class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-surface-800"
        >
          <i class="pi pi-plus text-xl text-surface-500"></i>
        </div>
        <h3 class="mb-2 text-lg font-medium text-surface-100">No workout sessions yet</h3>
        <p class="mb-6 text-surface-400">Create your first workout template to get started</p>
        <div class="mx-auto max-w-xs">
          <ui-button
            label="Create your first session"
            icon="pi pi-plus"
            [full]="true"
            (onClick)="openCreateDialog = true"
          />
        </div>
      </div>
    }
  </div>

  <session-dialog
    [(open)]="openCreateDialog"
    (openChange)="openCreateDialog = $event"
  ></session-dialog>
</div>
