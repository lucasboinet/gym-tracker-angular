<div class="mx-auto max-w-2xl space-y-6 p-4">
  <h2 class="text-lg font-semibold text-surface-50">Last workouts stats</h2>

  <div class="flex flex-col gap-2 sm:flex-row">
    <ui-select
      class="flex-1"
      [options]="stats()"
      [value]="selectedStat()"
      optionLabel="exerciseName"
      [filter]="true"
      [showClear]="true"
      placeholder="Select an exercise"
      (valueChange)="handleSelectedStatsChange($event)"
    />

    <ui-select
      class="flex-1"
      [options]="sessionService.sessions()"
      [value]="selectedSession()"
      optionLabel="name"
      [showClear]="true"
      placeholder="Select a session"
      (valueChange)="handleSelectSessionChange($event)"
    />
  </div>

  <div class="flex flex-col gap-6">
    @for (stat of filteredStats(); track $index) {
      <workout-chart [stat]="stat" />
    } @empty {
      <p class="py-8 text-center text-sm text-surface-500">No workout stats yet.</p>
    }
  </div>

  <!-- Bodyweight -->
  <div class="space-y-4 pt-2">
    <h2 class="text-lg font-semibold text-surface-50">Bodyweight</h2>

    @if (strengthRatio(); as sr) {
      <div
        class="flex items-center justify-between rounded-2xl border border-primary-500/20 bg-primary-500/5 p-4"
      >
        <div>
          <h3 class="text-sm font-medium text-surface-200">Strength-to-bodyweight</h3>
          <p class="mt-0.5 text-xs text-surface-400">
            Best {{ sr.exercise }} ({{ sr.liftDisplay }} {{ unit() }}) vs {{ sr.bwDisplay }}
            {{ unit() }}
          </p>
        </div>
        <div class="text-2xl font-bold text-primary-400">{{ sr.ratio }}×</div>
      </div>
    }

    <bodyweight-chart [entries]="bodyweightService.entries()" [unit]="unit()" />
  </div>
</div>
